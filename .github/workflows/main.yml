name: Build StoreMaster V12 Height75 - All Links Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build StoreMaster V12 Height75
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version

          echo "== Accepting Android SDK licenses =="
          timeout 180 bash -c 'yes | sdkmanager --licenses' || {
            echo "License step timed out or returned an error."
            echo "Continuing so the real SDK error is visible."
          }

          echo "== Installing required SDK packages =="
          yes | sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Extract StoreMaster project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project

          ZIP_FILE="StoreMaster-ADM-V12-Height75-IMAGE-PICKER-FIX-24H-ALL-LINKS.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            ls -lah
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d project

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE=$(find project -type f             \( -name "settings.gradle" -o -name "settings.gradle.kts" \)             -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Verify StoreMaster project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/storemaster/adm/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/assets/adm.html"
          echo "Project verification: OK"

      - name: Verify image picker and all external links
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PROJECT_DIR/app/src/main/java/com/storemaster/adm/MainActivity.java"

          grep -q "WebChromeClient" "$SRC"
          grep -q "onShowFileChooser" "$SRC"
          grep -q "ACTION_OPEN_DOCUMENT" "$SRC"
          grep -q "onActivityResult" "$SRC"
          grep -q "shouldOverrideUrlLoading" "$SRC"
          grep -q 'scheme.equals("tel")' "$SRC"
          grep -q 'scheme.equals("whatsapp")' "$SRC"
          grep -q 'scheme.equals("viber")' "$SRC"
          grep -q 'scheme.equals("tg")' "$SRC"
          grep -q 'scheme.equals("telegram")' "$SRC"
          grep -q 'h.equals("t.me")' "$SRC"
          grep -q 'h.equals("wa.me")' "$SRC"

          echo "All required fixes verified."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build StoreMaster APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload StoreMaster APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreMaster-ADM-APK-V12-Height75-AllLinksFix
          path: |
            project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
