name: Build StoreMaster APK V12 Height75 Image Picker Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build StoreMaster V12 Height75
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /tmp/android-licenses.log || true
          tail -n 40 /tmp/android-licenses.log || true

      - name: Install Android SDK
        run: |
          set -e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract StoreMaster V12 Height75
        run: |
          rm -rf project
          mkdir -p project

          ZIP_FILE="StoreMaster-ADM-V12-Height75-IMAGE-PICKER-FIX-24H.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          echo "ZIP found:"
          ls -lh "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          echo "===== PROJECT FILES ====="
          find project -maxdepth 6 -type f | sort

      - name: Locate Android project
        run: |
          SETTINGS_FILE=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Verify Android project
        run: |
          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle" \
            || test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" \
            || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/storemaster/adm/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/assets/adm.html"
          echo "Android project verification: OK"

      - name: Verify image picker and external links fixes
        run: |
          SRC="$PROJECT_DIR/app/src/main/java/com/storemaster/adm/MainActivity.java"
          grep -q "WebChromeClient" "$SRC"
          grep -q "onShowFileChooser" "$SRC"
          grep -q "ACTION_OPEN_DOCUMENT" "$SRC"
          grep -q "onActivityResult" "$SRC"
          grep -q "shouldOverrideUrlLoading" "$SRC"
          grep -q 'scheme.equals("tel")' "$SRC"
          grep -q 'scheme.equals("whatsapp")' "$SRC"
          grep -q 'scheme.equals("viber")' "$SRC"
          grep -q 'scheme.equals("tg")' "$SRC"
          grep -q 'scheme.equals("telegram")' "$SRC"
          grep -q 'h.equals("t.me")' "$SRC"
          grep -q 'h.equals("wa.me")' "$SRC"
          echo "Image picker + external links verification: OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build StoreMaster APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "===== GENERATED APK ====="
          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload StoreMaster APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreMaster-ADM-APK-V12-Height75-AllLinksFix
          path: |
            project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
