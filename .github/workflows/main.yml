name: Build StoreMaster V12 Height75 - All Links Fix

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/tmp/licenses.log 2>&1 || true
          tail -n 30 /tmp/licenses.log || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract original-based StoreMaster package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="StoreMaster-ADM-V12-Height75-IMAGE-PICKER-FIX-24H-ALL-LINKS-FINAL.zip"
          test -f "$ZIP_FILE" || { echo "ERROR: $ZIP_FILE not found"; ls -lah; exit 1; }
          rm -rf project
          mkdir project
          unzip -q -o "$ZIP_FILE" -d project

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS_FILE" || { echo "settings.gradle not found"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify project and fixes
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PROJECT_DIR/app/src/main/java/com/storemaster/adm/MainActivity.java"
          test -f "$SRC"
          test -f "$PROJECT_DIR/app/src/main/assets/adm.html"
          grep -q "WebChromeClient" "$SRC"
          grep -q "onShowFileChooser" "$SRC"
          grep -q "shouldOverrideUrlLoading" "$SRC"
          grep -q 'scheme.equals("tel")' "$SRC"
          grep -q 'scheme.equals("whatsapp")' "$SRC"
          grep -q 'scheme.equals("viber")' "$SRC"
          grep -q 'scheme.equals("tg")' "$SRC"
          grep -q 'scheme.equals("telegram")' "$SRC"
          echo "Verification OK"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreMaster-ADM-V12-Height75-AllLinksFix
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
